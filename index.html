<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smash Prep">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
<title>Smash Prep</title>
</head>
<body>
<header>
  <div><b>Smash Prep</b><small>TOURNAMENT PREP NOTES · v0.2.0</small></div>
  <button id="addEvent">＋ 大会</button>
</header>
<main>
  <section class="tools">
    <input id="search" placeholder="大会・プレイヤー・キャラ・メモを検索">
    <select id="sort">
      <option value="asc">開催日が近い順</option>
      <option value="desc">開催日が遠い順</option>
      <option value="name">大会名順</option>
    </select>
  </section>
  <section class="dataTools">
    <button class="ghost" id="exportData">バックアップ</button>
    <button class="ghost" id="importData">データ読込</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </section>
  <div id="events"></div>
</main>
<dialog id="dlg"></dialog>
<script src="./app.js"></script>
</body>
</html>
